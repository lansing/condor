[project]
name = "condor"
version = "0.1.0"
description = "TensorRT sidecar for Frigate"
requires-python = ">=3.12, <3.13"
dependencies = [
    "pyzmq>=26.0",
    "aiofiles>=24.0",
    "numpy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
# Terminal metrics TUI (condor-tui command).
# Install with: uv sync --extra tui
tui = [
    "textual>=0.70.0",
    "nvidia-ml-py>=12.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
condor = "condor.server.main:main"
condor-tui = "condor.tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["condor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
